<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WETWINZ CLEAN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      text-align: center;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
    }

    .brand {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 3px;
      margin: 0;
    }

    .clean {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 8px;
      margin-top: 8px;
    }

    .line {
      width: 55px;
      height: 3px;
      background: #111;
      margin: 25px auto;
    }

    .tagline {
      font-size: 17px;
      letter-spacing: 2px;
      margin-bottom: 45px;
    }

    .coming {
      font-size: 14px;
      letter-spacing: 3px;
      color: #777;
    }

    .website {
      position: absolute;
      bottom: 30px;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div class="page">

    <h1 class="brand">WETWINZ</h1>
    <div class="clean">CLEAN</div>

    <div class="line"></div>

    <div class="tagline">
      SMART CLEANING. BETTER LIVING.
    </div>

    <div class="coming">
      COMING SOON
    </div>

    <div class="website">
      WETWINZ.AE
    </div>

  </div>

</body>
</html>
