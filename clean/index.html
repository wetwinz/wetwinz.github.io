<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02070c">

  <title>WETWINZ CLEAN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at center, #06233a 0%, #020b13 45%, #000 100%);
      font-family: Arial, sans-serif;
      color: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 18px;
    }

    .logo {
      width: min(92vw, 720px);
      height: auto;
      display: block;
      border-radius: 20px;
      box-shadow: 0 15px 55px rgba(0, 190, 255, 0.15);
    }

    .tagline {
      margin-top: 30px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #e8faff;
    }

    .coming {
      margin-top: 15px;
      font-size: 12px;
      letter-spacing: 4px;
      color: #00cfff;
    }

    .website {
      margin-top: 45px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #c8a951;
    }

    @media (max-width: 600px) {
      .logo {
        width: 96vw;
        border-radius: 12px;
      }

      .tagline {
        font-size: 12px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="logo"
      src="wetwinz-clean-logo.png"
      alt="WETWINZ CLEAN"
    >

    <div class="tagline">
      SMART CLEANING. BETTER LIVING.
    </div>

    <div class="coming">
      COMING SOON
    </div>

    <div class="website">
      WETWINZ.AE
    </div>

  </main>

</body>
</html>
